name: Pull Request Labeler
on:
  - pull_request_target

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

