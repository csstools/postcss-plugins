<!DOCTYPE html>
<title>Custom Functions: Typed parameters with defaults</title>
<link rel="help" href="https://drafts.csswg.org/css-mixins-1/#function-prelude">

<div id="parent">
	<div id="target"></div>
</div>
<div id="main"></div>

<script>
	// Only typed parameters that have a default value are supported.
	//
	// The type is enforced through a generated `@property` registration, so a
	// value that does not match the type falls back to the default value.
		function stylesUrl() {
			return window.__TRANSFORM__ === false ? '/test/styles.css?transform=false' : '/test/styles.css';
		}

	window.runTest = async function runTest() {
		function assert_equals(actual, expected, message) {
			if (actual !== expected) {
				throw new Error(message + ': expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
			}
		}

		const testCases = [
			{
				name: 'Typed parameter with default, valid argument',
				style: `
					@function --f(--x <length>: 10px) {
						result: var(--x);
					}
					#target {
						--actual: --f(20px);
						--expected: 20px;
					}
				`,
			},
			{
				name: 'Typed parameter with default, invalid argument',
				style: `
					@function --f(--x <length>: 10px) {
						result: var(--x);
					}
					#target {
						--actual: --f(red);
						--expected: 10px;
					}
				`,
			},
			{
				name: 'Typed parameter with default, missing argument',
				style: `
					@function --f(--x <length>: 10px) {
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: 10px;
					}
				`,
			},
			{
				name: 'Typed parameter normalizes calc',
				style: `
					@function --f(--x <length>: 10px) {
						result: var(--x);
					}
					#target {
						--actual: --f(calc(100px + 1px));
						--expected: 101px;
					}
				`,
			},
			{
				name: 'Typed color parameter, valid argument',
				style: `
					@function --f(--x <color>: red) {
						result: var(--x);
					}
					#target {
						--actual: --f(blue);
						--expected: rgb(0, 0, 255);
					}
				`,
			},
			{
				name: 'Typed color parameter, invalid argument',
				style: `
					@function --f(--x <color>: red) {
						result: var(--x);
					}
					#target {
						--actual: --f(10px);
						--expected: rgb(255, 0, 0);
					}
				`,
			},
			{
				name: 'Mixed untyped and typed parameters',
				style: `
					@function --f(--x, --y <length>: 2px, --z <length>: 3px) {
						result: var(--x) var(--y) var(--z);
					}
					#target {
						--actual: --f(1px, 5px);
						--expected: 1px 5px 3px;
					}
				`,
			},
			{
				name: 'Mixed untyped and typed parameters, defaults',
				style: `
					@function --f(--x, --y <length>: 2px, --z <length>: 3px) {
						result: var(--x) var(--y) var(--z);
					}
					#target {
						--actual: --f(1px);
						--expected: 1px 2px 3px;
					}
				`,
			},
			{
				name: 'Default referencing another parameter',
				style: `
					@function --f(--l <length>: 10px) {
						result: --g();
					}
					@function --g() {
						result: var(--l);
					}
					#target {
						--actual: --f();
						--expected: 10px;
					}
				`,
			},
			{
				name: 'Complex type with default, valid argument',
				style: `
					@function --f(--x type(<length> | auto): auto) {
						result: var(--x);
					}
					#target {
						--actual: --f(10px);
						--expected: 10px;
					}
				`,
			},
			{
				name: 'Complex type with default, keyword argument',
				style: `
					@function --f(--x type(<length> | auto): auto) {
						result: var(--x);
					}
					#target {
						--actual: --f(auto);
						--expected: auto;
					}
				`,
			},
			{
				name: 'Complex type with default, invalid argument',
				style: `
					@function --f(--x type(<length> | auto): auto) {
						result: var(--x);
					}
					#target {
						--actual: --f(red);
						--expected: auto;
					}
				`,
			},
			{
				name: 'Integer type, valid argument',
				style: `
					@function --f(--x <integer>: 0) {
						result: var(--x);
					}
					#target {
						--actual: --f(3);
						--expected: 3;
					}
				`,
			},
			{
				name: 'Integer type, invalid argument',
				style: `
					@function --f(--x <integer>: 0) {
						result: var(--x);
					}
					#target {
						--actual: --f(3.5);
						--expected: 0;
					}
				`,
			},
			{
				name: 'initial in an untyped local refers to the parameter value',
				style: `
					@function --f(--x) {
						--x: 20px;
						--x: initial;
						result: var(--x);
					}
					#target {
						--actual: --f(5px);
						--expected: 5px;
					}
				`,
			},
			{
				// The spec resolves `initial` to the parameter's own value for
				// typed parameters too. Chrome currently resolves it to the
				// guaranteed-invalid value, so this case is not asserted natively.
				name: 'initial in a typed local refers to the parameter value',
				skipNative: true,
				style: `
					@function --f(--x <length>: 10px) {
						--x: 20px;
						--x: initial;
						result: var(--x);
					}
					#target {
						--actual: --f(5px);
						--expected: 5px;
					}
				`,
			},
			{
				name: 'initial in a typed local refers to the default value',
				skipNative: true,
				style: `
					@function --f(--x <length>: 10px) {
						--x: 20px;
						--x: initial;
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: 10px;
					}
				`,
			},
			{
				name: 'initial in a typed local refers to the default value for an invalid argument',
				skipNative: true,
				style: `
					@function --f(--x <length>: 10px) {
						--x: 20px;
						--x: initial;
						result: var(--x);
					}
					#target {
						--actual: --f(red);
						--expected: 10px;
					}
				`,
			},
			{
				name: 'initial in a complex typed local refers to the parameter value',
				skipNative: true,
				style: `
					@function --f(--x type(<length> | auto): auto) {
						--x: 20px;
						--x: initial;
						result: var(--x);
					}
					#target {
						--actual: --f(5px);
						--expected: 5px;
					}
				`,
			},
			{
				name: 'inherit in a local refers to the calling context',
				style: `
					@function --f() {
						--x: inherit;
						result: var(--x);
					}
					#target {
						--x: 20px;
						--actual: --f();
						--expected: 20px;
					}
				`,
			},
			{
				name: '`returns type(*)` is the default return type',
				style: `
					@function --f() returns type(*) {
						result: 7px;
					}
					#target {
						--actual: --f();
						--expected: 7px;
					}
				`,
			},
			{
				name: '`type(*)` parameter is untyped',
				style: `
					@function --f(--x type(*): 7px) {
						result: var(--x);
					}
					#target {
						--actual: --f(9px);
						--expected: 9px;
					}
				`,
			},

			{
				// Chrome does not implement @property inside @function yet, so
				// these cases only assert the transformed CSS.
				name: 'Local @property for a parameter keeps the parameter value',
				skipNative: true,
				style: `
					@function --f(--x <length>: 10px) {
						@property --x <length>: 20px;
						result: var(--x);
					}
					#target {
						--actual: --f() --f(30px);
						--expected: 10px 30px;
					}
				`,
			},
			{
				name: 'A local declaration shadows a parameter with a local @property',
				skipNative: true,
				style: `
					@function --f(--x <length>: 10px) {
						@property --x <length>: 20px;
						--x: 15px;
						result: var(--x);
					}
					#target {
						--actual: --f(30px);
						--expected: 15px;
					}
				`,
			},
			{
				// Chrome does not implement CSS-wide keywords in arguments yet,
				// so these cases only assert the transformed CSS.
				name: 'inherit argument refers to the calling element',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: FAIL) {
						result: var(--x, PASS);
					}
					#target {
						--x: 30px;
						--actual: --f(inherit);
						--expected: 30px;
					}
				`,
			},
			{
				name: 'inherit argument refers to an inherited custom property',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: FAIL) {
						result: var(--x, PASS);
					}
					#parent {
						--x: 40px;
					}
					#target {
						--actual: --f(inherit);
						--expected: 40px;
					}
				`,
			},
			{
				name: 'inherit argument refers to a caller function local',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: FAIL) {
						result: var(--x, PASS);
					}
					@function --g() {
						--x: PASS;
						result: --f(inherit);
					}
					#target {
						--actual: --g();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'inherit argument in a var() fallback refers to the calling element',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: FAIL) {
						result: var(--x, PASS);
					}
					#target {
						--x: 30px;
						--actual: --f(var(--unknown, inherit));
						--expected: 30px;
					}
				`,
			},
			{
				name: 'initial argument resolves to the guaranteed-invalid value',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: 10px) {
						result: var(--x, PASS);
					}
					#target {
						--actual: --f(initial);
						--expected: PASS;
					}
				`,
			},
			{
				name: 'unset argument resolves to the guaranteed-invalid value',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: 10px) {
						result: var(--x, PASS);
					}
					#target {
						--actual: --f(unset);
						--expected: PASS;
					}
				`,
			},
			{
				name: 'revert argument resolves to the guaranteed-invalid value',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: 10px) {
						result: var(--x, PASS);
					}
					#target {
						--actual: --f(revert);
						--expected: PASS;
					}
				`,
			},
			{
				name: 'revert-layer argument resolves to the guaranteed-invalid value',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: 10px) {
						result: var(--x, PASS);
					}
					#target {
						--actual: --f(revert-layer);
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Typed parameter inherit argument uses the calling element',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x <length>: 10px) {
						result: var(--x, PASS);
					}
					#target {
						--x: 30px;
						--actual: --f(inherit);
						--expected: 30px;
					}
				`,
			},
			{
				name: 'Typed parameter initial argument resolves to the guaranteed-invalid value',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x <length>: 10px) {
						result: var(--x, PASS);
					}
					#target {
						--actual: --f(initial);
						--expected: PASS;
					}
				`,
			},

			{
				name: 'A set var() value overrides a keyword fallback',
				skipNativeBrowsers: ['chromium'],
				style: `
					@function --f(--x: 10px) {
						result: var(--x, PASS);
					}
					#target {
						--known: 30px;
						--actual: --f(var(--known, initial));
						--expected: 30px;
					}
				`,
			},
			{
				name: 'An inactive conditional local registration falls back to the parameter',
				skipNative: true,
				style: `
					@function --f(--x: PASS) {
						@supports (not (width: 100px)) {
							@property --x {
								syntax: "<length>";
								inherits: true;
								initial-value: 10px;
							}
						}
						--x: initial;
						result: var(--x, FALLBACK);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'An active conditional local registration handles initial',
				skipNative: true,
				style: `
					@function --f(--x: PASS) {
						@supports (width: 100px) {
							@property --x {
								syntax: "<length>";
								inherits: true;
								initial-value: 10px;
							}
						}
						--x: initial;
						result: var(--x, FALLBACK);
					}
					#target {
						--actual: --f();
						--expected: 10px;
					}
				`,
			},

			{
				name: 'A conditional local declaration with a parameter registration falls back to the parameter',
				skipNative: true,
				style: `
					@function --f(--x <length>: 20px) {
						@supports (not (width: 100px)) {
							--x: 30px;
						}
						@property --x {
							syntax: "<length>";
							inherits: true;
							initial-value: 10px;
						}
						result: var(--x, 0px);
					}
					#target {
						--actual: --f();
						--expected: 20px;
					}
				`,
			},

		];

		for (const testCase of testCases) {
			if (window.__TRANSFORM__ === false && (
				testCase.skipNative ||
				(testCase.skipNativeBrowsers && testCase.skipNativeBrowsers.includes(window.__BROWSER__))
			)) {
				continue;
			}

			const styleElement = document.createElement('style');

			const testCaseStyle = await (fetch(stylesUrl(), {
				method: 'POST',
				body: testCase.style,
			}).then((response) => response.text()));

			styleElement.textContent = testCaseStyle;
			document.head.append(styleElement);

			const target = document.getElementById('target');
			const computed = window.getComputedStyle(target);

			assert_equals(
				computed.getPropertyValue('--actual'),
				computed.getPropertyValue('--expected'),
				testCase.name,
			);

			styleElement.remove();
		}

		return true;
	};
</script>
