<!DOCTYPE html>
<title>Custom Functions: Conditionals within @function</title>
<link rel="help" href="https://drafts.csswg.org/css-mixins-1/#conditional-rules">

<style>
	#container {
		container-type: size;
		width: 100px;
		height: 50px;
	}
</style>

<div id="container">
	<div id="parent">
		<div id="target"></div>
	</div>
</div>
<div id="main"></div>

<script>
	// Adapted from:
	// https://github.com/web-platform-tests/wpt/blob/master/css/css-mixins/functions/function-conditionals.html
		function stylesUrl() {
			return window.__TRANSFORM__ === false ? '/test/styles.css?transform=false' : '/test/styles.css';
		}

	window.runTest = async function runTest() {
		function assert_equals(actual, expected, message) {
			if (actual !== expected) {
				throw new Error(message + ': expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
			}
		}

		const testCases = [
			{
				name: 'Basic @supports',
				style: `
					@function --f() {
						result: FAIL;
						@supports (width: 100px) {
							result: PASS;
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Basic @supports (false)',
				style: `
					@function --f() {
						result: PASS;
						@supports (not (width: 100px)) {
							result: FAIL;
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Nested @supports',
				style: `
					@function --f() {
						result: FAIL;
						@supports (not (width: red)) {
							@supports (height: 100px) {
								result: PASS;
							}
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Nested @supports (false)',
				style: `
					@function --f() {
						result: FAIL-outer;
						@supports (not (width: red)) {
							result: PASS;
							@supports (height: red) {
								result: FAIL-inner;
							}
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Inconsequential conditional',
				style: `
					@function --f() {
						@supports (width: 100px) {
							result: FAIL;
						}
						result: PASS;
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: '@supports with locals',
				style: `
					@function --f(--x) {
						--y: 2;
						--z: 3;
						@supports (width: 100px) {
							--y: 20;
						}
						result: var(--x) var(--y) var(--z);
					}
					#target {
						--actual: --f(1);
						--expected: 1 20 3;
					}
				`,
			},
			{
				name: 'Basic @media',
				style: `
					@function --f() {
						result: FAIL;
						@media (width > 0px) {
							result: PASS;
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Basic @media (false)',
				style: `
					@function --f() {
						result: PASS;
						@media (not (width)) {
							result: FAIL;
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Nested @media',
				style: `
					@function --f() {
						result: FAIL;
						@media (width > 0px) {
							@media (not (height: 99999999px)) {
								result: PASS;
							}
							@media (width: 99999999px) {
								result: FAIL;
							}
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Nested @media (false)',
				style: `
					@function --f() {
						result: PASS;
						@media (not (width > 0px)) {
							@media (not (height: 99999999px)) {
								result: FAIL;
							}
							@media (width: 99999999px) {
								result: FAIL;
							}
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Locals within @media',
				style: `
					@function --f() {
						--x: FAIL;
						@media (width > 0px) {
							--x: PASS;
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: '@supports within @media',
				style: `
					@function --f() {
						--x: FAIL;
						@media (width > 0px) {
							@supports (color: green) {
								--x: PASS;
							}
							@supports (not (color: green)) {
								--x: FAIL;
							}
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: '@media within @supports',
				style: `
					@function --f() {
						--x: FAIL;
						@supports (color: green) {
							@media (width > 0px) {
								--x: PASS;
							}
							@media (width = 99999999999px) {
								--x: FAIL;
							}
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Basic @container',
				style: `
					@function --f() {
						result: FAIL;
						@container (width = 100px) {
							result: PASS;
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Basic @container (false)',
				style: `
					@function --f() {
						result: PASS;
						@container (width = 110px) {
							result: FAIL;
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Nested @container',
				style: `
					@function --f() {
						result: FAIL;
						@container (width = 100px) {
							@container (not (height = 75px)) {
								result: PASS;
							}
							@container (height: 75px) {
								result: FAIL;
							}
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Nested @container (false)',
				style: `
					@function --f() {
						result: PASS;
						@container (width = 200px) {
							@container (not (height = 75px)) {
								result: FAIL;
							}
							@container (width: 75px) {
								result: FAIL;
							}
						}
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: 'Locals within @container',
				style: `
					@function --f() {
						--x: FAIL;
						@container (width = 100px) {
							--x: PASS;
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: '@supports within @container',
				style: `
					@function --f() {
						--x: FAIL;
						@container (width = 100px) {
							@supports (color: green) {
								--x: PASS;
							}
							@supports (not (color: green)) {
								--x: FAIL;
							}
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: '@container within @supports',
				style: `
					@function --f() {
						--x: FAIL;
						@supports (color: green) {
							@container (width = 100px) {
								--x: PASS;
							}
							@container (width = 75px) {
								--x: FAIL;
							}
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: '@container, @media, @supports',
				style: `
					@function --f() {
						--x: FAIL;
						@container (width = 100px) {
							@media (width > 0px) {
								@supports (color: red) {
									--x: PASS;
								}
							}
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
			{
				name: '@supports, @media, @container',
				style: `
					@function --f() {
						--x: FAIL;
						@supports (color: red) {
							@media (width > 0px) {
								@container (width = 100px) {
									--x: PASS;
								}
							}
						}
						result: var(--x);
					}
					#target {
						--actual: --f();
						--expected: PASS;
					}
				`,
			},
		];

		for (const testCase of testCases) {
			const styleElement = document.createElement('style');

			const testCaseStyle = await (fetch(stylesUrl(), {
				method: 'POST',
				body: testCase.style,
			}).then((response) => response.text()));

			styleElement.textContent = testCaseStyle;
			document.head.append(styleElement);

			const target = document.getElementById('target');
			const computed = window.getComputedStyle(target);

			assert_equals(
				computed.getPropertyValue('--actual'),
				computed.getPropertyValue('--expected'),
				testCase.name,
			);

			styleElement.remove();
		}

		return true;
	};
</script>
