<!DOCTYPE html>
<title>CSS Mixins: Parameters and @private</title>
<link rel="help" href="https://drafts.csswg.org/css-mixins-1/#private">
<style>
	target {
		display: block;
	}
</style>

<body>
	<target class="private"></target>
	<target class="private-and-args"></target>
	<target class="shadowed-by-element"></target>
	<target class="conditional-registration">
		<target class="child"></target>
	</target>
	<target class="nested-argument"></target>
	<target class="fallback-argument"></target>
	<target class="contents-outer"></target>
	<target class="fallback-private"></target>
	<target class="applying-private"></target>
	<target class="contents-private"></target>
	<target class="contents-argument-private"></target>
	<div id="log"></div>
	<script type="module">
		window.addEventListener('click', () => {
			window.runTest();
		});

		window.runTest = async function runTest() {
			function assert_equals(actual, expected, message) {
				if (actual != expected) {
					log.innerHTML = message + ": expected " + expected + ", got " + actual;
					throw new Error(message + ": expected " + expected + ", got " + actual);
				}
			}

			// Only the transformed form is asserted.
			// Chrome Canary does not implement `@private`.
			const testCases = [
				{
					title: 'Mixin @private rules',
					target: '.private',
					property: 'box-shadow',
					expected: 'rgb(0, 128, 0) 2px 2px 0px 0px',
					style: `
						@mixin --private() {
							@private {
								--shadow-color: green;
							}
							box-shadow: 2px 2px var(--shadow-color);
						}
						.private {
							@apply --private;
						}
					`,
				},
				{
					title: 'Mixin parameters and @private rules combine',
					target: '.private-and-args',
					property: 'color',
					style: `
						@mixin --private-and-args(--color) {
							@private {
								--local: var(--color);
							}
							color: var(--local);
						}
						.private-and-args {
							@apply --private-and-args(green);
						}
					`,
				},
				{
					title: 'Nested mixins without parameters still see the mixin scope',
					target: '.nested-argument',
					property: 'color',
					expected: 'rgb(255, 0, 0)',
					style: `
						@mixin --nested-argument-inner() {
							color: var(--color);
						}
						@mixin --nested-argument-outer(--color) {
							@apply --nested-argument-inner;
						}
						.nested-argument {
							--color: blue;
							@apply --nested-argument-outer(red);
						}
					`,
				},
				{
					title: '@contents fallback blocks see the mixin scope',
					target: '.fallback-argument',
					property: 'color',
					expected: 'rgb(255, 0, 0)',
					style: `
						@mixin --fallback-argument(--color) {
							@contents {
								color: var(--color);
							}
						}
						.fallback-argument {
							--color: blue;
							@apply --fallback-argument(red);
						}
					`,
				},
				{
					title: 'Contents blocks authored in a mixin body see the mixin scope',
					target: '.contents-outer',
					property: 'color',
					expected: 'rgb(255, 0, 0)',
					style: `
						@mixin --contents-inner() {
							@contents;
						}
						@mixin --contents-outer(--color) {
							@apply --contents-inner {
								color: var(--color);
							}
						}
						.contents-outer {
							--color: blue;
							@apply --contents-outer(red);
						}
					`,
				},
				{
					title: 'Fallback blocks can define private properties',
					target: '.fallback-private',
					property: 'color',
					expected: 'rgb(255, 0, 0)',
					style: `
						@mixin --fallback-private() {
							@contents {
								@private {
									--x: red;
								}
								color: var(--x);
							}
						}
						.fallback-private {
							@apply --fallback-private;
						}
					`,
				},
				{
					title: 'Mixin @private registrations keep their conditions',
					target: '.conditional-registration .child',
					property: 'width',
					expected: '60px',
					style: `
						@mixin --conditional-registration() {
							@private {
								--size: 2em;

								@media (width < 0px) {
									@property --size {
										syntax: "<length>";
										inherits: true;
										initial-value: 1px;
									}
								}
							}
							font-size: 10px;

							& > .child {
								font-size: 30px;
								width: var(--size);
							}
						}
						.conditional-registration {
							@apply --conditional-registration;
						}
					`,
				},
				{
					title: 'Private properties in the applying rule',
					target: '.applying-private',
					property: 'color',
					style: `
						@mixin --applying-private() {
							color: var(--applying-private-color);
						}
						.applying-private {
							@private {
								--applying-private-color: green;
							}
							@apply --applying-private;
						}
					`,
				},
				{
					title: 'Private properties from a mixin body in a passed contents block',
					target: '.contents-private',
					property: 'color',
					style: `
						@mixin --contents-private-inner() {
							@contents;
						}
						@mixin --contents-private-outer(--color) {
							@apply --contents-private-inner {
								@private {
									--local: var(--color);
								}
								color: var(--local);
							}
						}
						.contents-private {
							@apply --contents-private-outer(green);
						}
					`,
				},
				{
					title: 'Private properties from the applying rule in a passed contents block',
					target: '.contents-argument-private',
					property: 'width',
					expected: '10px',
					style: `
						@mixin --contents-argument-private() {
							@contents;
						}
						.contents-argument-private {
							@private {
								--size: 10px;
							}
							@apply --contents-argument-private {
								width: var(--size);
							}
						}
					`,
				},
				{
					title: 'Mixin parameters shadow element custom properties',
					target: '.shadowed-by-element',
					property: 'color',
					style: `
						@mixin --shadowed(--color: green) {
							color: var(--color);
						}
						.shadowed-by-element {
							--color: red;
							@apply --shadowed;
						}
					`,
				},
			];

			for (let testCase of testCases) {
				const styleElement = document.createElement('style');

				const testCaseStyle = await (fetch(`/test/styles.css?transform=true`, {
					method: 'POST',
					body: testCase['style'],
				}).then((response) => response.text()));

				styleElement.textContent = testCaseStyle;
				document.head.append(styleElement);

				const target = document.querySelector(testCase['target']);

				assert_equals(
					window.getComputedStyle(target)[testCase['property']],
					testCase['expected'] || 'rgb(0, 128, 0)',
					testCase['title'] + " target '" + testCase['target'] + "'"
				);

				styleElement.remove();
			}

			return true;
		}
	</script>
</body>
