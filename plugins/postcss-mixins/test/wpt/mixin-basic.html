<!DOCTYPE html>
<title>CSS Mixins: Basic</title>
<link rel="help" href="https://drafts.csswg.org/css-mixins-1/#mixin-rule">
<style>
	target {
		display: block;
	}
</style>

<body>
	<target class="basic"></target>
	<target class="no-args"></target>
	<target class="with-media"></target>
	<target class="multiple-apply"></target>
	<div id="log"></div>
	<script type="module">
		window.addEventListener('click', () => {
			window.runTest();
		});

		window.runTest = async function runTest() {
			function assert_equals(actual, expected, message) {
				if (actual != expected) {
					log.innerHTML = message + ": expected " + expected + ", got " + actual;
					throw new Error(message + ": expected " + expected + ", got " + actual);
				}
			}

			// Only the transformed form is asserted.
			// Chrome Canary only implements mixins with a `@result` block,
			// but `@result` was dropped from the specification.
			const testCases = [
				{
					title: 'Basic mixin',
					target: '.basic',
					property: 'color',
					style: `
						@mixin --basic() {
							color: green;
						}
						.basic {
							@apply --basic;
						}
					`,
				},
				{
					title: 'Mixin without parameter list',
					target: '.no-args',
					property: 'color',
					style: `
						@mixin --no-args {
							color: green;
						}
						.no-args {
							@apply --no-args;
						}
					`,
				},
				{
					title: 'Mixin with conditional rules',
					target: '.with-media',
					property: 'color',
					style: `
						@mixin --with-media() {
							color: green;

							@media screen {
								color: green;
							}
						}
						.with-media {
							@apply --with-media;
						}
					`,
				},
				{
					title: 'Multiple applies in a single rule',
					target: '.multiple-apply',
					property: 'outline-color',
					style: `
						@mixin --a() {
							color: green;
						}
						@mixin --b() {
							outline-color: green;
						}
						.multiple-apply {
							@apply --a;
							@apply --b;
						}
					`,
				},
			];

			// Native support is only asserted when the browser implements the current
			// specification form (declarations directly in the mixin body).
			const nativeSupport = await (async () => {
				const css = `@mixin --support-probe() { color: green; } .support-probe { @apply --support-probe; }`;
				const response = await fetch(`/test/styles.css?transform=false`, { method: 'POST', body: css });
				const styleElement = document.createElement('style');
				styleElement.textContent = await response.text();
				document.head.append(styleElement);
				const probe = document.createElement('div');
				probe.className = 'support-probe';
				document.body.append(probe);
				const supported = window.getComputedStyle(probe).color === 'rgb(0, 128, 0)';
				probe.remove();
				styleElement.remove();
				return supported;
			})();

			for (let testCase of testCases) {
				for (const transform of nativeSupport ? ['true', 'false'] : ['true']) {
					const styleElement = document.createElement('style');

					const testCaseStyle = await (fetch(`/test/styles.css?transform=${transform}`, {
						method: 'POST',
						body: testCase['style'],
					}).then((response) => response.text()));

					styleElement.textContent = testCaseStyle;
					document.head.append(styleElement);

					const target = document.querySelector(testCase['target']);

					assert_equals(
						window.getComputedStyle(target)[testCase['property']],
						testCase['expected'] || 'rgb(0, 128, 0)',
						testCase['title'] + " (transform=" + transform + ") target '" + testCase['target'] + "'"
					);

					styleElement.remove();
				}
			}

			return true;
		}
	</script>
</body>
