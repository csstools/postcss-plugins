<!DOCTYPE html>
<title>CSS Mixins: Arguments</title>
<link rel="help" href="https://drafts.csswg.org/css-mixins-1/#mixin-args">
<style>
	target {
		display: block;
	}
</style>

<body>
	<target class="basic"></target>
	<target class="defaults"></target>
	<target class="fallback"></target>
	<target class="braces"></target>
	<target class="generated-argument-name"></target>
	<target class="private-parameter-name"></target>
	<target class="inherit-argument"></target>
	<target class="initial-argument"></target>
	<target class="unset-argument"></target>
	<target class="revert-argument"></target>
	<target class="revert-layer-argument"></target>
	<div id="log"></div>
	<script type="module">
		window.addEventListener('click', () => {
			window.runTest();
		});

		window.runTest = async function runTest() {
			function assert_equals(actual, expected, message) {
				if (actual != expected) {
					log.innerHTML = message + ": expected " + expected + ", got " + actual;
					throw new Error(message + ": expected " + expected + ", got " + actual);
				}
			}

			// Only the transformed form is asserted.
			const testCases = [
				{
					title: 'Basic mixin parameter passing',
					target: '.basic',
					property: 'color',
					style: `
						@mixin --basic(--color) {
							color: var(--color);
						}
						.basic {
							@apply --basic(green);
						}
					`,
				},
				{
					title: 'Defaults in mixin parameters',
					target: '.defaults',
					property: 'color',
					style: `
						@mixin --defaults(--color: green) {
							color: var(--color);
						}
						.defaults {
							@apply --defaults;
						}
					`,
				},
				{
					title: 'Fallback is used with no parameter and no default',
					target: '.fallback',
					property: 'color',
					style: `
						@mixin --fallback(--color) {
							color: var(--color, green);
						}
						.fallback {
							@apply --fallback;
						}
					`,
				},
				{
					title: 'Argument wrapped in {}',
					target: '.braces',
					property: 'background-color',
					style: `
						@mixin --braces(--color) {
							background-color: var(--color);
						}
						.braces {
							@apply --braces({green});
						}
					`,
				},
				{
					title: 'Parameter named like a generated argument',
					target: '.generated-argument-name',
					property: 'color',
					style: `
						@mixin --generated-argument-name(--arg-0) {
							color: var(--arg-0);
						}
						.generated-argument-name {
							@apply --generated-argument-name(green);
						}
					`,
				},
				{
					title: 'Private property named like a parameter',
					target: '.private-parameter-name',
					property: 'color',
					expected: 'rgb(255, 0, 0)',
					style: `
						@mixin --private-parameter-name(--arg-1) {
							@private {
								--arg-1: red;
							}

							color: var(--arg-1);
						}
						.private-parameter-name {
							@apply --private-parameter-name(green);
						}
					`,
				},
				{
					title: 'CSS-wide keyword arguments are left unchanged (inherit)',
					target: '.inherit-argument',
					property: 'color',
					expected: 'rgb(0, 0, 255)',
					nativeOnly: true,
					style: `
						body { color: rgb(0, 0, 255); }
						@mixin --inherit-argument(--color) {
							color: var(--color, red);
						}
						.inherit-argument {
							--color: green;
							@apply --inherit-argument(inherit);
						}
					`,
				},
				{
					title: 'CSS-wide keyword arguments are left unchanged (initial)',
					target: '.initial-argument',
					property: 'color',
					expected: 'rgb(0, 0, 0)',
					nativeOnly: true,
					style: `
						body { color: rgb(0, 0, 255); }
						@mixin --initial-argument(--color) {
							color: var(--color, red);
						}
						.initial-argument {
							--color: green;
							@apply --initial-argument(initial);
						}
					`,
				},
				{
					title: 'CSS-wide keyword arguments are left unchanged (unset)',
					target: '.unset-argument',
					property: 'color',
					expected: 'rgb(0, 0, 255)',
					nativeOnly: true,
					style: `
						body { color: rgb(0, 0, 255); }
						@mixin --unset-argument(--color) {
							color: var(--color, red);
						}
						.unset-argument {
							--color: green;
							@apply --unset-argument(unset);
						}
					`,
				},
				{
					title: 'CSS-wide keyword arguments are left unchanged (revert)',
					target: '.revert-argument',
					property: 'color',
					expected: 'rgb(0, 0, 255)',
					nativeOnly: true,
					style: `
						body { color: rgb(0, 0, 255); }
						@mixin --revert-argument(--color) {
							color: var(--color, red);
						}
						.revert-argument {
							--color: green;
							@apply --revert-argument(revert);
						}
					`,
				},
				{
					title: 'CSS-wide keyword arguments are left unchanged (revert-layer)',
					target: '.revert-layer-argument',
					property: 'color',
					expected: 'rgb(0, 0, 255)',
					nativeOnly: true,
					style: `
						body { color: rgb(0, 0, 255); }
						@mixin --revert-layer-argument(--color) {
							color: var(--color, red);
						}
						.revert-layer-argument {
							--color: green;
							@apply --revert-layer-argument(revert-layer);
						}
					`,
				},
			];

			// Native support is only asserted when the browser implements the current
			// specification form (declarations directly in the mixin body).
			const nativeSupport = await (async () => {
				const css = `@mixin --support-probe() { color: green; } .support-probe { @apply --support-probe; }`;
				const response = await fetch(`/test/styles.css?transform=false`, { method: 'POST', body: css });
				const styleElement = document.createElement('style');
				styleElement.textContent = await response.text();
				document.head.append(styleElement);
				const probe = document.createElement('div');
				probe.className = 'support-probe';
				document.body.append(probe);
				const supported = window.getComputedStyle(probe).color === 'rgb(0, 128, 0)';
				probe.remove();
				styleElement.remove();
				return supported;
			})();

			for (let testCase of testCases) {
				// The plugin leaves CSS-wide keyword arguments to the browser, so these
				// only have a result where the browser implements mixins.
				if (testCase['nativeOnly'] && !nativeSupport) {
					continue;
				}

				for (const transform of nativeSupport ? ['true', 'false'] : ['true']) {
					const styleElement = document.createElement('style');

					const testCaseStyle = await (fetch(`/test/styles.css?transform=${transform}`, {
						method: 'POST',
						body: testCase['style'],
					}).then((response) => response.text()));

					styleElement.textContent = testCaseStyle;
					document.head.append(styleElement);

					const target = document.querySelector(testCase['target']);

					assert_equals(
						window.getComputedStyle(target)[testCase['property']],
						testCase['expected'] || 'rgb(0, 128, 0)',
						testCase['title'] + " (transform=" + transform + ") target '" + testCase['target'] + "'"
					);

					styleElement.remove();
				}
			}

			return true;
		}
	</script>
</body>
